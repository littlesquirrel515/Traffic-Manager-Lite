// Read-only wire projection of V2Fly v5.53.0 ObservatoryService.
syntax = "proto3";
package v2ray.core.app.observatory.command;
option go_package = "traffic-manager-lite/internal/proto/v2flyobserve;observepb";
service ObservatoryService { rpc GetOutboundStatus(GetOutboundStatusRequest) returns(GetOutboundStatusResponse) {} }
message GetOutboundStatusRequest { string Tag=1; }
message GetOutboundStatusResponse { ObservationResult status=1; }
message ObservationResult { repeated OutboundStatus status=1; }
// Only retain the boolean; errors, targets and outbound tags are not diagnostic data.
message OutboundStatus { bool alive=1; }
