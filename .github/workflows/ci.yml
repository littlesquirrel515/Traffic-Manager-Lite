name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: Download verified official Xray
        run: |
          mkdir -p .tools/xray
          curl -fsSL --retry 2 https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip -o .tools/xray.zip
          printf '%s  %s\n' '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae' '.tools/xray.zip' | sha256sum -c -
          unzip -q .tools/xray.zip -d .tools/xray
          chmod +x .tools/xray/xray
      - name: Real Xray integration
        run: go test -race -v ./internal/xraymonitor -run TestRealXrayCollectorsAndDiagnostics
        env:
          TML_TEST_XRAY: ${{ github.workspace }}/.tools/xray/xray
      - run: go build -o dist/traffic-manager-lite ./cmd/traffic-manager-lite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix .tools/ui playwright@1.62.1
      - run: .tools/ui/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/e2e.cjs
        env:
          TML_PLAYWRIGHT_MODULE: ${{ github.workspace }}/.tools/ui/node_modules/playwright
      - run: node scripts/xray-e2e.cjs
        env:
          TML_TEST_XRAY: ${{ github.workspace }}/.tools/xray/xray
          TML_PLAYWRIGHT_MODULE: ${{ github.workspace }}/.tools/ui/node_modules/playwright
      - run: docker build -t traffic-manager-lite:ci .
      - name: Container health smoke test
        run: |
          docker run -d --name tml-ci -e TML_ADMIN_PASSWORD=ci-fixture-password-123456 -p 127.0.0.1:18080:8080 traffic-manager-lite:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health; then exit 0; fi
            sleep 1
          done
          docker logs tml-ci
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-verification
          path: dist/ui-verification
